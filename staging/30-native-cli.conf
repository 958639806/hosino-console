# 仅当 CLI_LAUNCH=direct 时才需要（默认 systemd-run 模式不需要任何 drop-in）。
# direct 模式下 CLI 继承控制台沙箱：ProtectSystem=strict + ReadOnlyPaths=/ + PrivateTmp，
# 只能写下面这些目录，且 sudo 出来的 root 同样是只读文件系统 —— 并不是“和终端一样”。
[Service]
ReadWritePaths=/home/ubuntu/cli-sandbox /home/ubuntu/.claude /home/ubuntu/.claude.json /home/ubuntu/.codex /home/ubuntu/.gemini /home/ubuntu/.cache /home/ubuntu/.npm /home/ubuntu/.config
Environment=CLI_LAUNCH=direct
